name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: IA-64 firmware (GNU GCC)
    runs-on: ubuntu-24.04

    container:
      image: fedora:44

    defaults:
      run:
        shell: bash

    steps:
      - name: Install the IA-64 cross toolchain
        run: |
          set -euo pipefail

          dnf --assumeyes --setopt=install_weak_deps=False install \
            binutils-ia64-linux-gnu \
            coreutils \
            gcc-ia64-linux-gnu \
            git \
            gzip \
            make \
            python3 \
            tar

      - name: Check out the source tree
        uses: actions/checkout@v6

      - name: Build and validate the firmware
        run: |
          set -euo pipefail

          firmware_dir="roms/ia64-firmware"
          binary="$firmware_dir/ia64-firmware.bin"
          elf="$firmware_dir/ia64-firmware.elf"
          map="$firmware_dir/ia64-firmware.map"
          sections="$firmware_dir/ia64-firmware.sections"

          test -f "$(ia64-linux-gnu-gcc -print-libgcc-file-name)"

          make -C "$firmware_dir" clean
          make -C "$firmware_dir" -j"$(nproc)"

          test -s "$binary"
          test -s "$elf"
          test -s "$map"
          test -s "$sections"

          python3 tests/unit/test-ia64-firmware-layout.py \
            "$binary" \
            "$elf"

          ia64-linux-gnu-readelf -h "$elf" > firmware-elf-header.txt
          grep -Eiq 'Machine:.*IA-64' firmware-elf-header.txt

      - name: Package the firmware
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-firmware-$version"
          archive="$PWD/qemu-system-ia64-firmware.tar.gz"

          rm -rf "$dist_root" "$archive"
          mkdir -p "$dist"

          install -m 0644 \
            roms/ia64-firmware/ia64-firmware.bin \
            roms/ia64-firmware/ia64-firmware.elf \
            roms/ia64-firmware/ia64-firmware.map \
            roms/ia64-firmware/ia64-firmware.sections \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            "$dist/"

          tar -czf "$archive" \
            -C "$dist_root" \
            "$(basename "$dist")"

          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload the firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: Firmware
          path: qemu-system-ia64-firmware.tar.gz
          if-no-files-found: error
          archive: false

  linux:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: Linux x86-64 (GCC)
            optimized: false
            build_dir: build-linux
            dist_stem: qemu-system-ia64-linux-x86_64
            archive: qemu-system-ia64-linux-x86_64.tar.gz
            artifact_name: Linux-AMD64
          - job_name: Linux x86-64-v2 optimized (GCC)
            optimized: true
            build_dir: build-linux-x86_64-v2-optimized
            dist_stem: qemu-system-ia64-linux-x86_64-v2-optimized
            archive: qemu-system-ia64-linux-x86_64-v2-optimized.tar.gz
            artifact_name: Linux-AMD64-x86-64-v2-optimized

    steps:
      - name: Check out the source tree
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison \
            build-essential \
            file \
            flex \
            git \
            libfdt-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libslirp-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            python3-wheel \
            zlib1g-dev

      - name: Configure and build the Linux emulator
        run: |
          set -euo pipefail

          build_dir="${{ matrix.build_dir }}"
          optimization_args=()
          if [[ "${{ matrix.optimized }}" == "true" ]]; then
            optimization_args=(
              --x86-version=2
              --enable-lto
              --disable-debug-info
              --enable-strip
              --disable-qom-cast-debug
              --disable-stack-protector
              --disable-hardening
              --disable-pie
              --enable-trace-backends=nop
              --extra-cflags="-fomit-frame-pointer -ffunction-sections -fdata-sections"
              --extra-cxxflags="-fomit-frame-pointer -ffunction-sections -fdata-sections"
              --extra-ldflags="-Wl,-O2 -Wl,--gc-sections -no-pie"
              -Doptimization=3
            )
          fi

          rm -rf "$build_dir"
          mkdir -p "$build_dir"

          (
            cd "$build_dir"
            CC=gcc CXX=g++ ../configure \
              "${optimization_args[@]}" \
              --python=/usr/bin/python3 \
              --target-list=ia64-softmmu \
              --enable-system \
              --enable-tcg \
              --enable-pixman \
              --enable-fdt=system \
              --enable-gtk \
              --enable-sdl \
              --enable-slirp \
              --enable-vnc \
              --disable-docs \
              --disable-werror
          )

          # Build only the host emulator. Firmware is built in a separate job.
          ninja -C "$build_dir" -j"$(nproc)" qemu-system-ia64

          if [[ "${{ matrix.optimized }}" == "true" ]]; then
            strip --strip-unneeded "$build_dir/qemu-system-ia64"
          fi

      - name: Validate and package the Linux artifact
        run: |
          set -euo pipefail

          executable="${{ matrix.build_dir }}/qemu-system-ia64"
          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/${{ matrix.dist_stem }}-$version"
          archive="$PWD/${{ matrix.archive }}"

          test -x "$executable"
          test -s "$executable"

          file "$executable" > linux-file.txt
          cat linux-file.txt
          grep -Eq 'ELF 64-bit.*x86-64' linux-file.txt

          ldd "$executable" | tee linux-library-dependencies.txt
          if grep -Fq 'not found' linux-library-dependencies.txt; then
            echo "Linux x86-64 artifact has unresolved shared libraries" >&2
            exit 1
          fi
          "$executable" --version

          rm -rf "$dist_root" "$archive"
          mkdir -p "$dist/share/keymaps"

          install -m 0755 "$executable" "$dist/"
          install -m 0644 \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            linux-library-dependencies.txt \
            "$dist/"

          install -m 0644 \
            pc-bios/efi-e1000.rom \
            pc-bios/vgabios-ati.bin \
            pc-bios/vgabios-stdvga.bin \
            "$dist/share/"

          install -m 0644 pc-bios/keymaps/* "$dist/share/keymaps/"

          tar -czf "$archive" \
            -C "$dist_root" \
            "$(basename "$dist")"

          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload the Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          archive: false

  linux-aarch64:
    name: Linux AArch64 (GCC, native)
    needs: firmware
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Verify the native AArch64 runner
        run: |
          set -euo pipefail

          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64

      - name: Check out the source tree
        uses: actions/checkout@v6

      - name: Download the firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: qemu-system-ia64-firmware.tar.gz
          path: firmware-artifact

      - name: Extract and validate the firmware artifact
        run: |
          set -euo pipefail

          archive="firmware-artifact/qemu-system-ia64-firmware.tar.gz"
          firmware_dir="firmware-artifact/extracted"

          test -s "$archive"
          mkdir -p "$firmware_dir"
          tar -xzf "$archive" -C "$firmware_dir" --strip-components=1

          for output in bin elf map sections; do
            test -s "$firmware_dir/ia64-firmware.$output"
          done

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison \
            build-essential \
            file \
            flex \
            git \
            libfdt-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libslirp-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            python3-wheel \
            zlib1g-dev

      - name: Configure and build the Linux emulator
        run: |
          set -euo pipefail

          mkdir build-linux-aarch64

          (
            cd build-linux-aarch64
            CC=gcc CXX=g++ ../configure \
              --python=/usr/bin/python3 \
              --target-list=ia64-softmmu \
              --enable-system \
              --enable-tcg \
              --enable-pixman \
              --enable-fdt=system \
              --enable-gtk \
              --enable-sdl \
              --enable-slirp \
              --enable-vnc \
              --disable-docs \
              --disable-werror
          )

          firmware_source="firmware-artifact/extracted"
          firmware_stage="build-linux-aarch64/roms/ia64-firmware"
          mkdir -p "$firmware_stage"

          for output in bin elf map sections; do
            install -m 0644 \
              "$firmware_source/ia64-firmware.$output" \
              "$firmware_stage/"
            test -s "$firmware_stage/ia64-firmware.$output"
          done

          ninja -C build-linux-aarch64 -j"$(nproc)" \
            qemu-img \
            qemu-system-ia64 \
            tests/qtest/ia64-vpc-test \
            tests/unit/test-ia64-decoder \
            tests/unit/test-ia64-fpreg \
            tests/unit/test-ia64-rse-migration \
            tests/unit/test-ia64-simd

      - name: Validate the native AArch64 executable
        run: |
          set -euo pipefail

          executable="build-linux-aarch64/qemu-system-ia64"
          test -x "$executable"
          test -s "$executable"

          elf_header="$(readelf -h "$executable")"
          printf '%s\n' "$elf_header"
          grep -Eq 'Machine:[[:space:]]+AArch64' <<<"$elf_header"
          "$executable" --version

      - name: Run IA-64 TCG unit tests natively
        run: |
          set -euo pipefail

          build-linux-aarch64/pyvenv/bin/meson test \
            -C build-linux-aarch64 \
            --no-rebuild \
            --num-processes 1 \
            --print-errorlogs \
            qemu:test-ia64-decoder \
            qemu:test-ia64-fpreg \
            qemu:test-ia64-rse-migration \
            qemu:test-ia64-simd \
            qemu:test-ia64-fpmodel \
            qemu:test-ia64-tcg-core \
            qemu:test-ia64-tcg-memory-nat \
            qemu:test-ia64-tcg-fp \
            qemu:test-ia64-tcg-rse \
            qemu:test-ia64-tcg-mmu \
            qemu:test-ia64-tcg-interrupt \
            qemu:test-ia64-tcg-pal \
            qemu:qtest-ia64/ia64-vpc-test

      - name: Package the Linux AArch64 artifact
        run: |
          set -euo pipefail

          executable="build-linux-aarch64/qemu-system-ia64"
          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-linux-aarch64-$version"
          archive="$PWD/qemu-system-ia64-linux-aarch64.tar.gz"

          ldd "$executable" | tee linux-aarch64-library-dependencies.txt
          if grep -Fq 'not found' linux-aarch64-library-dependencies.txt; then
            echo "Linux AArch64 artifact has unresolved shared libraries" >&2
            exit 1
          fi

          rm -rf "$dist_root" "$archive"
          mkdir -p "$dist/share/keymaps"

          install -m 0755 "$executable" "$dist/"
          install -m 0644 \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            linux-aarch64-library-dependencies.txt \
            "$dist/"

          install -m 0644 \
            pc-bios/efi-e1000.rom \
            pc-bios/vgabios-ati.bin \
            pc-bios/vgabios-stdvga.bin \
            "$dist/share/"

          install -m 0644 pc-bios/keymaps/* "$dist/share/keymaps/"

          tar -czf "$archive" \
            -C "$dist_root" \
            "$(basename "$dist")"

          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload the Linux AArch64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Linux-AA64
          path: qemu-system-ia64-linux-aarch64.tar.gz
          if-no-files-found: error
          archive: false

  windows:
    name: ${{ matrix.job_name }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: Windows x86-64 (MSYS2 MinGW GCC)
            optimized: false
            build_dir: build-win64
            dist_stem: qemu-system-ia64-windows-x86_64
            archive: qemu-system-ia64-windows-x86_64.zip
            artifact_name: Windows-AMD64
          - job_name: Windows x86-64-v2 optimized (MSYS2 MinGW GCC)
            optimized: true
            build_dir: build-win64-x86_64-v2-optimized
            dist_stem: qemu-system-ia64-windows-x86_64-v2-optimized
            archive: qemu-system-ia64-windows-x86_64-v2-optimized.zip
            artifact_name: Windows-AMD64-x86-64-v2-optimized

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out the source tree
        uses: actions/checkout@v6

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            bison
            diffutils
            findutils
            flex
            git
            grep
            make
            sed
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-adwaita-icon-theme-legacy
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-dtc
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdk-pixbuf2
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gtk-update-icon-cache
            mingw-w64-x86_64-hicolor-icon-theme
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-python-wheel
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-shared-mime-info
            mingw-w64-x86_64-zlib

      - name: Configure and build the Windows emulator
        run: |
          set -euo pipefail

          build_dir="${{ matrix.build_dir }}"
          version="$(tr -d '\r\n' < VERSION)"
          install_dir="$(cygpath -m "$PWD/dist/${{ matrix.dist_stem }}-$version")"
          optimization_args=()
          configure_env=(CC=gcc CXX=g++)
          if [[ "${{ matrix.optimized }}" == "true" ]]; then
            # GCC's LTO bytecode requires plugin-aware archive tools.
            configure_env+=(AR=gcc-ar NM=gcc-nm RANLIB=gcc-ranlib)
            optimization_args=(
              --x86-version=2
              --enable-lto
              --disable-debug-info
              --enable-strip
              --disable-qom-cast-debug
              --disable-stack-protector
              --disable-hardening
              --disable-pie
              --enable-trace-backends=nop
              --extra-cflags="-fomit-frame-pointer"
              --extra-cxxflags="-fomit-frame-pointer"
              # Some MinGW GCC/LTO combinations emit invalid SEH directives
              # when final assembly is split into per-function sections.
              # Retain LTO and gc-sections, but disable those two transforms.
              --extra-ldflags="-Wl,-O2 -Wl,--gc-sections -fno-function-sections -fno-data-sections"
              -Doptimization=3
            )
          fi

          rm -rf "$build_dir"
          mkdir -p "$build_dir"

          (
            cd "$build_dir"
            env "${configure_env[@]}" ../configure \
              "${optimization_args[@]}" \
              --prefix="$install_dir" \
              --python=/mingw64/bin/python \
              --target-list=ia64-softmmu \
              --enable-system \
              --enable-tcg \
              --enable-pixman \
              --enable-fdt=system \
              --enable-gtk \
              --enable-sdl \
              --enable-slirp \
              --enable-vnc \
              --disable-docs \
              --disable-werror
          )

          # Build only the host executables. Firmware is built in a separate job.
          ninja -C "$build_dir" -j"$(nproc)" \
            qemu-system-ia64.exe \
            qemu-system-ia64w.exe

          if [[ "${{ matrix.optimized }}" == "true" ]]; then
            strip --strip-unneeded \
              "$build_dir/qemu-system-ia64.exe" \
              "$build_dir/qemu-system-ia64w.exe"
          fi

      - name: Validate and stage the Windows distribution
        run: |
          set -euo pipefail

          build_dir="${{ matrix.build_dir }}"
          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/${{ matrix.dist_stem }}-$version"

          imported_dlls() {
            objdump -p "$1" \
              | sed -n 's/^[[:space:]]*DLL Name: //p' \
              | tr -d '\r'
          }

          is_windows_system_dll() {
            local dll="$1"
            local lower="${dll,,}"

            [[ "$lower" == api-ms-win-*.dll ||
               "$lower" == ext-ms-win-*.dll ||
               -f "/c/Windows/System32/$dll" ]]
          }

          for executable in \
            "$build_dir/qemu-system-ia64.exe" \
            "$build_dir/qemu-system-ia64w.exe"; do
            if [[ ! -s "$executable" ]]; then
              echo "Missing or empty Windows executable: $executable" >&2
              exit 1
            fi
            if ! format="$(objdump -f "$executable")"; then
              echo "Unable to inspect Windows executable: $executable" >&2
              exit 1
            fi
            if ! grep -q 'pei-x86-64' <<<"$format"; then
              echo "Unexpected executable format: $executable" >&2
              printf '%s\n' "$format" >&2
              exit 1
            fi
          done

          rm -rf "$dist_root"
          mkdir -p \
            "$dist/etc" \
            "$dist/lib" \
            "$dist/share/icons" \
            "$dist/share/keymaps"

          install -m 0755 \
            "$build_dir/qemu-system-ia64.exe" \
            "$build_dir/qemu-system-ia64w.exe" \
            "$dist/"

          # GLib locates these helpers by name at runtime; they do not appear
          # in the executable's PE import table.
          install -m 0755 \
            /mingw64/bin/gspawn-win64-helper.exe \
            /mingw64/bin/gspawn-win64-helper-console.exe \
            "$dist/"

          install -m 0644 \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            "$dist/"

          install -m 0644 \
            pc-bios/efi-e1000.rom \
            pc-bios/vgabios-ati.bin \
            pc-bios/vgabios-stdvga.bin \
            "$dist/share/"

          install -m 0644 pc-bios/keymaps/* "$dist/share/keymaps/"

          # GTK loads these resources and modules at runtime rather than
          # expressing them as executable DLL imports.
          cp -aL /mingw64/etc/fonts "$dist/etc/"
          cp -aL /mingw64/etc/gtk-3.0 "$dist/etc/"
          cp -aL /mingw64/lib/gdk-pixbuf-2.0 "$dist/lib/"
          cp -aL /mingw64/lib/gtk-3.0 "$dist/lib/"
          cp -aL /mingw64/share/fontconfig "$dist/share/"
          cp -aL /mingw64/share/glib-2.0 "$dist/share/"
          cp -aL /mingw64/share/gtk-3.0 "$dist/share/"
          cp -aL /mingw64/share/icons/Adwaita "$dist/share/icons/"
          cp -aL /mingw64/share/icons/AdwaitaLegacy "$dist/share/icons/"
          cp -aL /mingw64/share/icons/hicolor "$dist/share/icons/"
          cp -aL /mingw64/share/mime "$dist/share/"
          cp -aL /mingw64/share/themes "$dist/share/"

          # Generate relocatable module caches explicitly.  The Windows GTK3
          # package currently has no external input-method DLLs, so its pacman
          # hook does not create immodules.cache on a fresh installation.
          /mingw64/bin/gdk-pixbuf-query-loaders.exe \
            | tr -d '\r' \
            > "$dist/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          /mingw64/bin/gtk-query-immodules-3.0.exe \
            | tr -d '\r' \
            > "$dist/lib/gtk-3.0/3.0.0/immodules.cache"

          # Rebuild every other package-hook-generated cache in the staged
          # tree instead of relying on the state of the MSYS2 installation.
          /mingw64/bin/glib-compile-schemas.exe \
            "$dist/share/glib-2.0/schemas"
          for icon_theme in Adwaita AdwaitaLegacy hicolor; do
            /mingw64/bin/gtk-update-icon-cache.exe -f -q \
              "$dist/share/icons/$icon_theme"
          done
          /mingw64/bin/update-mime-database.exe "$dist/share/mime"

          # Copy MinGW runtime DLLs and their transitive dependencies.
          declare -A seen=()
          queue=(
            "$dist/qemu-system-ia64.exe"
            "$dist/qemu-system-ia64w.exe"
            "$dist/gspawn-win64-helper.exe"
            "$dist/gspawn-win64-helper-console.exe"
          )
          while IFS= read -r module; do
            queue+=("$module")
          done < <(find "$dist/lib" -type f -iname '*.dll' -print)

          while (( ${#queue[@]} > 0 )); do
            pe_file="${queue[0]}"
            queue=("${queue[@]:1}")

            if ! imports="$(imported_dlls "$pe_file")"; then
              echo "Unable to inspect PE imports: $pe_file" >&2
              exit 1
            fi
            while IFS= read -r dll; do
              [[ -n "$dll" ]] || continue

              key="${dll,,}"
              if [[ -n "${seen[$key]+x}" ]]; then
                continue
              fi
              seen["$key"]=1

              source_dll="/mingw64/bin/$dll"
              if [[ -f "$source_dll" ]]; then
                install -m 0755 "$source_dll" "$dist/$dll"
                queue+=("$source_dll")
              elif ! is_windows_system_dll "$dll"; then
                echo "Missing runtime DLL: $dll (required by $pe_file)" >&2
                exit 1
              fi
            done <<<"$imports"
          done

          runtime_dll_count="$(find "$dist" -maxdepth 1 \
            -type f -iname '*.dll' | wc -l)"
          if (( runtime_dll_count == 0 )); then
            echo "No MinGW runtime DLLs were staged" >&2
            exit 1
          fi

          loader_dll_count="$(find \
            "$dist/lib/gdk-pixbuf-2.0/2.10.0/loaders" \
            -type f -iname '*.dll' | wc -l)"
          if (( loader_dll_count == 0 )); then
            echo "No GDK Pixbuf loader DLLs were staged" >&2
            exit 1
          fi

          required_runtime_files=(
            "$dist/libgtk-3-0.dll"
            "$dist/gspawn-win64-helper.exe"
            "$dist/gspawn-win64-helper-console.exe"
            "$dist/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
            "$dist/lib/gtk-3.0/3.0.0/immodules.cache"
            "$dist/share/glib-2.0/schemas/gschemas.compiled"
            "$dist/share/icons/Adwaita/index.theme"
            "$dist/share/icons/AdwaitaLegacy/index.theme"
            "$dist/share/icons/Adwaita/icon-theme.cache"
            "$dist/share/icons/AdwaitaLegacy/icon-theme.cache"
            "$dist/share/icons/hicolor/icon-theme.cache"
            "$dist/share/mime/mime.cache"
          )
          for required_file in "${required_runtime_files[@]}"; do
            if [[ ! -f "$required_file" ]]; then
              echo "Missing staged GTK runtime file: $required_file" >&2
              exit 1
            fi
          done

          # Module caches must remain valid after extracting the artifact to
          # a location other than the MSYS2 installation prefix.
          if ! grep -Eiq '^"[^"]*libpixbufloader-[^"]+\.dll"$' \
            "$dist/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"; then
            echo "GDK Pixbuf loader cache contains no loader entries" >&2
            exit 1
          fi
          if grep -Eiq '(^|")([a-z]:[\\/]|/mingw64/)' \
            "$dist/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" \
            "$dist/lib/gtk-3.0/3.0.0/immodules.cache"; then
            echo "GTK module cache contains an absolute MSYS2 path" >&2
            exit 1
          fi

          # Run both staged executables without the MSYS2 MinGW bin directory.
          runtime_path="$dist:/c/Windows/System32:/c/Windows"
          if ! PATH="$runtime_path" \
            "$dist/qemu-system-ia64.exe" --version; then
            echo "Staged console executable failed to start" >&2
            exit 1
          fi
          if ! PATH="$runtime_path" \
            "$dist/qemu-system-ia64w.exe" --version; then
            echo "Staged GUI executable failed to start" >&2
            exit 1
          fi

          if ! display_help="$(PATH="$runtime_path" \
            "$dist/qemu-system-ia64.exe" -display help 2>&1)"; then
            printf '%s\n' "$display_help" >&2
            echo "Unable to query staged display backends" >&2
            exit 1
          fi
          printf '%s\n' "$display_help"
          if ! grep -Eq '(^|[[:space:]])gtk([[:space:]]|$)' \
            <<<"$display_help"; then
            echo "Staged executable does not expose the GTK display backend" >&2
            exit 1
          fi

      - name: Create the Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content -Raw VERSION).Trim()
          $source = Join-Path $PWD "dist\${{ matrix.dist_stem }}-$version"
          $archive = Join-Path $PWD "${{ matrix.archive }}"

          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          Compress-Archive -LiteralPath $source -DestinationPath $archive -CompressionLevel Optimal

          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -eq 0) {
            throw "The Windows archive was not created correctly."
          }

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          archive: false
