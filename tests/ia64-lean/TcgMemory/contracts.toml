    (steps : List (TcgMemory.Program.Schedule Cpu)),
    TcgMemory.Program.sourceRun m steps = some final → TcgMemory.Program.guestRun m steps = some final) ∧
  (∀ implicitOrder, (TcgMemory.Program.storeMask implicitOrder &&& TcgMemory.storeStoreMask) =
    TcgMemory.storeStoreMask) ∧
  (∀ {Cpu : Type} (address : Nat) (writes : List (TcgMemory.Program.Write Cpu))
    (w : TcgMemory.Program.Write Cpu) (byte : TcgMemory.Byte),
    TcgMemory.Program.newest address writes = some (w, byte) →
    ∃ later earlier, writes = later ++ w :: earlier ∧
      TcgMemory.Program.payload w address = some byte ∧
      ∀ other, other ∈ later → TcgMemory.Program.payload other address = none) ∧
  (∀ {Cpu : Type} (m : TcgMemory.Program.Machine Cpu) (cpu : Cpu) (i : TcgMemory.Load)
    (input actual : TcgMemory.CellInput),
    TcgMemory.Program.sample m (m.threads cpu) cpu (.scalar ⟨.load i, input⟩) =
      some (.scalar ⟨.load i, actual⟩) →
    ∀ offset,
      let address := (m.phys cpu (TcgMemory.getGR (m.threads cpu).regs i.base)).toNat + offset
      actual.bytes offset = match TcgMemory.Program.newest address (m.threads cpu).pending with
        | some (_, byte) => byte
        | none => TcgMemory.Program.publishedByte m.initial m.committed address) ∧
  (∀ {Cpu : Type} (m : TcgMemory.Program.Machine Cpu) (t : TcgMemory.Program.Thread Cpu)
    (cpu : Cpu) (i : TcgMemory.AtomicInstruction) (input actual : TcgMemory.CellInput) (parallel : Bool),
    TcgMemory.Program.sample m t cpu (.semaphore i input parallel) = some (.semaphore i actual true) →
    ∀ offset, actual.bytes offset = TcgMemory.Program.publishedByte m.initial m.committed
      ((m.phys cpu (TcgMemory.getGR t.regs i.base)).toNat + offset)) ∧
  (∀ {Cpu : Type} (candidate old : TcgMemory.Program.Write Cpu)
    (earlier : List (TcgMemory.Program.Write Cpu)),
    old ∈ earlier →
    TcgMemory.Program.publishAllowed TcgMemory.Program.tcgPolicy candidate earlier = false) ∧
  (∀ {Cpu : Type} (candidate old : TcgMemory.Program.Write Cpu)
    (earlier : List (TcgMemory.Program.Write Cpu)),
    candidate.release = true → old ∈ earlier →
    TcgMemory.Program.publishAllowed TcgMemory.Program.guestPolicy candidate earlier = false) ∧
  (∀ {Cpu : Type} (policy : TcgMemory.Program.Policy) (candidate old : TcgMemory.Program.Write Cpu)
    (earlier : List (TcgMemory.Program.Write Cpu)),
    old ∈ earlier → TcgMemory.Program.overlap old candidate.base candidate.bytes.length = true →
    TcgMemory.Program.publishAllowed policy candidate earlier = false) ∧
  (∀ {Cpu : Type} [DecidableEq Cpu] (m next : TcgMemory.Program.Machine Cpu) (cpu : Cpu)
    (index : Nat) (w : TcgMemory.Program.Write Cpu),
    (m.threads cpu).pending[index]? = some w →
    TcgMemory.Program.publish TcgMemory.Program.tcgPolicy m cpu index = some next →
    TcgMemory.Program.publishAllowed TcgMemory.Program.tcgPolicy w
      ((m.threads cpu).pending.drop (index + 1)) = true ∧ next.committed = w :: m.committed) ∧
  (∀ {Cpu : Type} [DecidableEq Cpu] (m : TcgMemory.Program.Machine Cpu) (cpu : Cpu)
    (next : List TcgMemory.Program.Command),
    (m.threads cpu).next = .mf :: next → (m.threads cpu).pending.isEmpty = false →
    TcgMemory.Program.issue TcgMemory.Program.tcgPolicy TcgMemory.tcgStep TcgMemory.tcgAtomic
      m cpu = none)
"""

