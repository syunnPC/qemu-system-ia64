module = "TcgMemory.Implementation"
statement = """
  ((∀ big upper bytes,
    TcgMemory.CompareWide.sourceHalf big upper
      (TcgMemory.CompareWide.orderWords big (TcgMemory.CompareWide.operand bytes big)) =
        TcgMemory.unpack 8 big (fun offset => bytes (if upper then offset + 8 else offset))) ∧
  (∀ i s m, TcgMemory.CompareWide.beforePrimitive i s m = none →
    TcgMemory.CompareWide.attempt i s {m with observations := [TcgMemory.CompareWide.firstPair m]} =
      TcgMemory.CompareWide.architectureAt i s m (TcgMemory.CompareWide.firstPair m)) ∧
  (∀ {Cpu : Type} (p : TcgMemory.AtomicPrograms Cpu) (h : TcgMemory.CompareWide.BlockInput p)
    (i : TcgMemory.CompareWide.Instruction) (s after : TcgMemory.Registers)
    (m : TcgMemory.CompareWide.Inputs) (e : TcgMemory.CompareWide.Effect),
    TcgMemory.CompareWide.History p h i s m → m.parallel = true →
    TcgMemory.CompareWide.replay p h i s m = some (.retired after e) → e.store.isSome = true →
    ∃ (loaded : TcgMemory.CompareWide.Inputs) (index : Nat) (inside : index < h.casAt.length)
      (oldBytes : List TcgMemory.Byte),
      TcgMemory.CompareWide.decodeHistory p h i s m = some loaded ∧ h.loadAt ≤ h.casAt[index] ∧
        TcgMemory.CompareWide.blockSnapshot p h (TcgMemory.CompareWide.blockBase p h i s)
          h.casAt[index] = some oldBytes ∧
        TcgMemory.CompareWide.firstCAS i s loaded index
          (TcgMemory.CompareWide.decodeSnapshot m.cell.guestBig oldBytes) ∧
        TcgMemory.CompareWide.architectureAt i s loaded
          (TcgMemory.CompareWide.decodeSnapshot m.cell.guestBig oldBytes) = .retired after e) ∧
  (∀ {Cpu : Type} (p : TcgMemory.AtomicPrograms Cpu) (h : TcgMemory.CompareWide.BlockInput p)
    (base : TcgMemory.Word) (position : Nat) (bytes : List TcgMemory.Byte),
    TcgMemory.CompareWide.blockSnapshot p h base position = some bytes →
    ∀ offset, offset < 16 → ∃ previous writer value,
      let address := base.toNat + offset
      bytes[offset]? = some value ∧ TcgMemory.ByteAtomic.payloadByte p writer address = some value ∧
        previous < position ∧
        TcgMemory.ByteAtomic.writeAtByte p h.timeline (base.toNat / 16) address previous = some writer ∧
        (∀ other contender, other < position →
          TcgMemory.ByteAtomic.writeAtByte p h.timeline (base.toNat / 16) address other = some contender →
          other ≤ previous)) ∧
  (∀ i s after m e bytes, TcgMemory.CompareWide.attempt i s m = .retired after e →
    e.store = some bytes →
    bytes = TcgMemory.pack 8 m.cell.guestBig (TcgMemory.getGR s i.source) ++
      TcgMemory.pack 8 m.cell.guestBig m.csd ∧ bytes.length = 16 ∧
      ∀ base offset before, offset < 16 →
        TcgMemory.CompareWide.memoryAfter base e.store before (base + offset) = bytes[offset]?) ∧
  (∀ base address stores before, address < base ∨ base + 16 ≤ address →
    TcgMemory.CompareWide.memoryAfter base stores before address = before address)) ∧
  (∀ {Cpu : Type} [DecidableEq Cpu] (block : TcgMemory.CompareWide.Block Cpu) (cpu : Cpu)
    (after : TcgMemory.Registers) (e : TcgMemory.CompareWide.Effect),
    (TcgMemory.CompareWide.step block cpu).2 = some (after, e) → e.store.isSome = true →
    ∃ current, block.waiting cpu = some current ∧
      TcgMemory.CompareWide.mappedBlock block cpu current = true ∧
      TcgMemory.CompareWide.architectureAt current.instruction current.regs current.inputs
        (TcgMemory.CompareWide.operand block.bytes current.inputs.cell.guestBig) = .retired after e ∧
      (TcgMemory.CompareWide.step block cpu).1.bytes = TcgMemory.CompareWide.replace block.bytes e.store)
"""

[contract."ordering:tcg-aligned-wb-program"]
check = "tcg-memory"
module = "TcgMemory.Implementation"
statement = """
