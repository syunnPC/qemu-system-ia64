[contract."route:tcg-rse-alloc-resident"]
check = "rse"
module = "Rse.Implementation"
statement = """
∀ (s : RseSpec.FrameState) (sof sol : BitVec 7) (sor : BitVec 4)
  (r : BitVec 7) (old : BitVec 64) (nat : Bool) (qp : BitVec 6) (slot : BitVec 2)
  (startsGroup stopAfterSlot0 : Bool),
  RseSpec.allocSite qp slot startsGroup stopAfterSlot0 → s.complete →
  ({ s.cfm with sof := sof, sol := sol, sor := sor } : RseSpec.Frame).valid →
  r ≠ 0 → r.toNat < 32 + sof.toNat →
  (sor = s.cfm.sor ∨ s.cfm.gr = 0 ∧ s.cfm.fr = 0 ∧ s.cfm.pr = 0) →
  (sof.toNat : Int) - s.cfm.sof.toNat ≤ s.invalid + s.clean →
  RseImplementation.allocResidentC s (RseImplementation.packAllocC sof sol sor) r old nat =
    (RseSpec.allocResident s sof sol sor, RseSpec.allocDestination s)
"""

[contract."route:tcg-rse-cover-frame"]
check = "rse"
module = "Rse.Implementation"
statement = """
∀ (s : RseSpec.FrameState) (hasVirtualization endsGroup : Bool),
  RseSpec.coverSite s hasVirtualization endsGroup → s.complete →
  RseImplementation.coverFrameC s = RseSpec.coverFrame s
"""

[contract."route:tcg-rse-alloc-register"]
check = "rse"
module = "Rse.Implementation"
statement = """
∀ (oldSize newSize : Nat) (invalid : Int) (rrb : BitVec 7) (destination reg : Nat)
  (pfs : BitVec 64) (old loaded : RseSpec.RegisterCell) (oldDirty : Bool),
  destination ≠ 0 → destination < 32 + newSize →
  RseSpec.registerRefines
    (RseImplementation.allocRegisterC oldSize newSize destination reg pfs old loaded)
    (RseSpec.allocRegister oldSize newSize destination reg pfs old) ∧
  ((RseImplementation.allocDirtyC oldSize newSize invalid rrb destination reg oldDirty = true) ↔
    (32 ≤ reg ∧ reg < 128 ∧ destination = reg ∨
      (oldSize ≤ newSize ∧ (newSize : Int) - oldSize ≤ invalid ∧ rrb = 0) ∧ oldDirty = true))
"""

[contract."route:tcg-rse-cover-register"]
check = "rse"
module = "Rse.Implementation"
statement = """
∀ (sof sor rrb : BitVec 8) (bol v : BitVec 32) (dirty natFilesClear : Bool)
  (current : RseSpec.RegisterCell) (physical : BitVec 32 → RseSpec.RegisterCell),
  bol < 96 → v < 96 → v < sof.zeroExtend 32 →
  (rrb.zeroExtend 32 < RseSpec.rotateCount sof sor ∨ RseSpec.rotateCount sof sor = 0) →
  (dirty = false → physical (RseSpec.virtToPhys sof sor rrb bol v) = current) →
  (natFilesClear = true →
    (physical (RseSpec.virtToPhys sof sor rrb bol v)).2 = false ∧ current.2 = false) →
  RseImplementation.coverSavedRegisterC sof sor rrb bol v dirty natFilesClear current physical =
    RseSpec.coverSavedRegister sof sor rrb bol v current
"""

