# Expected propositions are maintained separately from submitted proofs.

[contract."function:target/ia64/arch/memory.c:ia64_memop_size"]
check = "memory"
module = "Memory.Implementation"
statement = "∀ m : BitVec 32, MemoryImplementation.memopSize m = MemorySpec.descriptorBytes m"

[contract."function:target/ia64/arch/memory.c:ia64_data_big_endian"]
check = "memory"
module = "Memory.Implementation"
statement = "∀ psr : BitVec 64, MemoryImplementation.psrEndian psr = MemorySpec.dataBigEndian psr"

[contract."function:target/ia64/arch/memory.c:ia64_runtime_data_memop"]
check = "memory"
module = "Memory.Implementation"
statement = """
∀ (m : BitVec 32) (host : Bool) (psr : BitVec 64),
  MemoryImplementation.runtimeDescriptor m host (MemoryImplementation.psrEndian psr) =
  MemorySpec.dataDescriptor m host (MemorySpec.dataBigEndian psr)
"""

[contract."function:target/ia64/translate/translate.c:ia64_memop_with_endian"]
check = "memory"
module = "Memory.Implementation"
statement = """
∀ (m : BitVec 32) (host guest : Bool),
  MemoryImplementation.tcgDescriptor m host guest = MemorySpec.dataDescriptor m host guest
"""
